<main>
  <h1>📝 {{ title() }}</h1>
  <p>Kazi zimekamilika: <b>{{ kamiliZilizo() }}</b> kati ya <b>{{ kazi().length }}</b></p>

  <ul class="orodha">
    @for (k of kazi(); track k.id) {
      <li (click)="badiliza(k.id)" [class.imekamilika]="k.imekamilika">
        <input type="checkbox" [checked]="k.imekamilika" (click)="$event.stopPropagation(); badiliza(k.id)" />
        {{ k.jina }}
      </li>
    }
  </ul>

  <p class="kidokezo">Bonyeza kazi kuibadilisha (imemalizika / haijamalizika)</p>

  <router-outlet />
</main>
